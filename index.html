<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos — Henry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <span class="logo">📸 Galeria do Henry</span>
    <span class="sub">Fotografia & experimentos visuais</span>
  </header>


  <nav class="categorias" id="categorias">
    <button class="cat-btn ativo" data-categoria="todas">Todas</button>
    <button class="cat-btn" data-categoria="enquadramento">Enquadramento</button>
    <button class="cat-btn" data-categoria="angulos">Ângulos</button>
    <button class="cat-btn" data-categoria="tecnicas">Lightroom</button>
    <button class="cat-btn" data-categoria="paisagens">Espelhos & Paisagens</button>
    <button class="cat-btn" data-categoria="texturas">Texturas & Formas</button>
    <button class="cat-btn" data-categoria="edicao">Photoshop</button>
  </nav>


  <main>
    <div class="galeria" id="galeria">

      <!-- Enquadramento -->
      <figure class="foto" data-categoria="enquadramento">
        <img src="https://i.ibb.co/zhkvfvqb/primeiro-enquadramento.png" alt="Primeiro enquadramento">
        <figcaption>Enquadramento I</figcaption>
      </figure>
      <figure class="foto" data-categoria="enquadramento">
        <img src="https://i.ibb.co/9mMcZMCR/IMG-2431.jpg" alt="Foto 1">
        <figcaption>Retrato I</figcaption>
      </figure>
      <figure class="foto" data-categoria="enquadramento">
        <img src="https://i.ibb.co/9kjtnfmf/IMG-2430.jpg" alt="Foto 2">
        <figcaption>Retrato II</figcaption>
      </figure>

    
      <figure class="foto" data-categoria="angulos">
        <img src="https://i.ibb.co/VWMzbS8j/terceiro-angulo.png" alt="Terceiro ângulo">
        <figcaption>Ângulo III</figcaption>
      </figure>
      <figure class="foto" data-categoria="angulos">
        <img src="https://i.ibb.co/m7qqwpN/inferior.png" alt="Ângulo inferior">
        <figcaption>Ângulo inferior</figcaption>
      </figure>

   
      <figure class="foto" data-categoria="tecnicas">
        <img src="https://i.ibb.co/SXw7sBzT/motion-blur-henry.jpg" alt="Motion Blur">
        <figcaption>Motion Blur</figcaption>
      </figure>
      <figure class="foto" data-categoria="tecnicas">
        <img src="https://i.ibb.co/BVVLr8z8/lightpaint-henry.jpg" alt="Lightpaint">
        <figcaption>Lightpaint</figcaption>
      </figure>

      <figure class="foto" data-categoria="paisagens">
        <img src="https://i.ibb.co/mVgbDmK3/espelhos-e-paisagens-henry.jpg" alt="Espelhos e paisagens">
        <figcaption>Espelho pequeno</figcaption>
      </figure>
      <figure class="foto" data-categoria="paisagens">
        <img src="https://i.ibb.co/3mQgGpR5/espelho-grande-henry.jpg" alt="Espelho grande">
        <figcaption>Espelho grande</figcaption>
      </figure>

   
      <figure class="foto" data-categoria="texturas">
        <img src="https://i.ibb.co/0jMRq9h2/henry-texturas-e-formas.jpg" alt="Texturas e formas">
        <figcaption>Texturas & Formas I</figcaption>
      </figure>
      <figure class="foto" data-categoria="texturas">
        <img src="https://i.ibb.co/35LkpSBK/henry-texturas-e-formas2.jpg" alt="Texturas e formas 2">
        <figcaption>Texturas & Formas II</figcaption>
      </figure>

  
      <figure class="foto" data-categoria="edicao">
        <img src="https://i.ibb.co/VYbzP7M0/dupla-exposi-o-png.png" alt="Dupla exposição">
        <figcaption>Dupla exposição</figcaption>
      </figure>
      <figure class="foto" data-categoria="edicao">
        <img src="https://i.ibb.co/YBWnkp55/foto-e-colagem-henry.png" alt="Foto e colagem">
        <figcaption>Foto & colagem</figcaption>
      </figure>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
